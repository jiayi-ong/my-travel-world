steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - Dockerfile.api
      - -t
      - gcr.io/$PROJECT_ID/travel-world-api:latest
      - .
    timeout: 900s   # world generation during build can take a few minutes

images:
  - gcr.io/$PROJECT_ID/travel-world-api:latest

options:
  machineType: E2_HIGHCPU_8   # faster build; world gen is CPU-bound

timeout: 1200s
